<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentry Error Test</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://browser.sentry-cdn.com/7.112.2/bundle.tracing.replay.min.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f7;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #1d1d1f;
      margin-bottom: 24px;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #0071e3;
      border: none;
      border-radius: 980px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #0077ed;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./test.js"></script>
</body>
</html>
